name: Images

# A version tag (v2026.11.1) builds and pushes every image. A manual run pushes
# them as "edge" instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' kiosk_satellite_ground_control/config.yaml)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the app version ${version} in config.yaml"
              exit 1
            fi
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  cpu:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Standalone image (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/kiosk-satellite-ground-control:${{ needs.version.outputs.tag }}
            ${{ github.ref_type == 'tag' && format('{0}/kiosk-satellite-ground-control:latest', env.REGISTRY) || '' }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
      - name: Home Assistant app, amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=amd64
          tags: ${{ env.REGISTRY }}/amd64-kiosk-satellite-ground-control:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=cpu
      - name: Home Assistant app, aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=aarch64
          tags: ${{ env.REGISTRY }}/aarch64-kiosk-satellite-ground-control:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=cpu

  cuda:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Make room for two CUDA images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: CUDA image (amd64, and arm64 for the GB10)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/kiosk-satellite-ground-control:${{ needs.version.outputs.tag == 'edge' && 'edge-cuda' || format('{0}-cuda', needs.version.outputs.tag) }}
            ${{ github.ref_type == 'tag' && format('{0}/kiosk-satellite-ground-control:cuda', env.REGISTRY) || '' }}
