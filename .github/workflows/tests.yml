name: Tests

# The tests that need LibriSpeech skip here: the corpus isn't on GitHub's
# runners. They run in full on a machine that has it (see README).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
