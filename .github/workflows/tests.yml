name: Tests

# The tests that need LibriSpeech skip here: the corpus isn't on GitHub's
# runners. They run in full on a machine that has it (see README).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          # mesa-vulkan-drivers has a software Vulkan device, which the Vulkan tests run the shaders on.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng mesa-vulkan-drivers libvulkan1
          pip install -e '.[dev]'
          # ONNX Runtime's WebGPU build, beside the CPU one, for the Vulkan image's other models.
          pip install --no-deps --target "$RUNNER_TEMP/onnxruntime-webgpu" onnxruntime-webgpu==1.27.0
          echo "VULKAN_ORT=$RUNNER_TEMP/onnxruntime-webgpu" >> "$GITHUB_ENV"
      - name: Test
        run: python -m pytest -q
